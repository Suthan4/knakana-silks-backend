name: Validate backend

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/ses-email-provider

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Prisma config validates DATABASE_URL when generating the client.
      # Prisma generate does not connect to the database.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kankana_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
